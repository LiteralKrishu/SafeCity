services:
  inference:
    build:
      context: ./service
      target: runtime
    container_name: safecity-inference
    restart: unless-stopped
    init: true
    ports:
      - "8000:8000"
    env_file:
      - path: ./service/.env
        required: false
    environment:
      SAFECITY_MODEL_PRELOAD: "true"
      SAFECITY_DATABASE_PATH: /data/safecity-inference.db
      SAFECITY_PATTERN_PATH: /app/app/knowledge/patterns.json
      SAFECITY_CUSTOM_PATTERN_PATH: /data/patterns.local.json
      TFHUB_CACHE_DIR: /models
    volumes:
      - safecity-data:/data
      - safecity-models:/models
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 768M

  inference-test:
    profiles: ["test"]
    build:
      context: ./service
      target: test
    environment:
      SAFECITY_MODEL_PRELOAD: "false"
      SAFECITY_DATABASE_PATH: /tmp/safecity-inference-test.db
      SAFECITY_PATTERN_PATH: /app/app/knowledge/patterns.json
      SAFECITY_CUSTOM_PATTERN_PATH: /tmp/patterns.local.json
      TFHUB_CACHE_DIR: /models
    volumes:
      - safecity-models:/models
      - ./service/tests:/app/tests:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  safecity-data:
  safecity-models:
