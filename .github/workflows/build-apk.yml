name: Build APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgstreamer1.0 \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          unzip \
          zip \
          autoconf \
          libtool \
          pkg-config \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo5 \
          cmake \
          libffi-dev \
          libssl-dev
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython==0.29.33 virtualenv
    
    - name: Setup Buildozer Android SDK
      working-directory: ./safecity_kivy
      run: |
        # Create buildozer directory structure
        mkdir -p ~/.buildozer/android/platform/
        
        # Set up environment for license acceptance
        export JAVA_HOME=$JAVA_HOME_17_X64
        
        # Initialize buildozer to download SDK (this will fail but sets up directories)
        timeout 300 python -m buildozer android debug 2>&1 || true
        
        # Accept all SDK licenses explicitly
        if [ -d "$HOME/.buildozer/android/platform/android-sdk" ]; then
          yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Install required build-tools with AIDL
          yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager \
            "build-tools;34.0.0" \
            "platforms;android-33" \
            "platform-tools" || true
          
          # Verify AIDL installation
          echo "Checking for AIDL..."
          ls -la $HOME/.buildozer/android/platform/android-sdk/build-tools/ || true
          find $HOME/.buildozer/android/platform/android-sdk -name "aidl" -type f 2>/dev/null || echo "AIDL search complete"
        fi
    
    - name: Accept SDK licenses (retry)
      working-directory: ./safecity_kivy
      run: |
        # Accept licenses for any remaining components
        if [ -f "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
          yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
        fi
        
        # Also check alternative SDK location
        if [ -d "/usr/local/lib/android/sdk" ]; then
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
        fi
    
    - name: Build APK
      working-directory: ./safecity_kivy
      env:
        JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
      run: |
        mkdir -p assets
        cp ../assets/models/* assets/ 2>/dev/null || true
        
        # Run buildozer with verbose output
        python -m buildozer -v android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: safecity-apk
        path: safecity_kivy/bin/*.apk
        
    - name: Upload build logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs
        path: |
          safecity_kivy/.buildozer/logs/
          safecity_kivy/.buildozer/android/platform/android-sdk/licenses/
