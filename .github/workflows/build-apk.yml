name: Build APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'build-tools;34.0.0 platforms;android-34 platform-tools ndk;25.2.9519653'
        accept-android-sdk-licenses: true
    
    - name: Install AIDL and additional SDK components
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34" || true
        # Verify AIDL is available
        ls -la $ANDROID_HOME/build-tools/34.0.0/aidl || echo "AIDL location check"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython
    
    - name: Accept Android SDK licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
    
    - name: Build APK
      working-directory: ./safecity_kivy
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      run: |
        mkdir -p assets
        cp ../assets/models/* assets/ 2>/dev/null || true
        python -m buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: safecity-apk
        path: safecity_kivy/bin/*.apk
